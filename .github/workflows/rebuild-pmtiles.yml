name: Rebuild building PMTiles

on:
  repository_dispatch:
    types: [gebaeude-stp-changed]
  workflow_dispatch:

concurrency:
  group: rebuild-building-pmtiles
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tippecanoe build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Build and install tippecanoe
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          make -C "$RUNNER_TEMP/tippecanoe" -j2
          sudo make -C "$RUNNER_TEMP/tippecanoe" install

      - name: Build PMTiles from Supabase
        run: python scripts/build_pmtiles.py

      - uses: actions/upload-artifact@v4
        with:
          name: buildings-pmtiles
          path: buildings.pmtiles
          if-no-files-found: error
          retention-days: 7